name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: [1.21]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: |
        go mod tidy
        go mod download

    - name: Format code check
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Code is not formatted. Please run 'go fmt ./...'"
          gofmt -s -l .
          exit 1
        fi

    - name: Run tests
      run: go test -v ./...

    - name: Build application
      run: go build -o gocommit

    - name: Test build executable (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        chmod +x gocommit
        file gocommit
        ./gocommit --help || echo "Binary created successfully"

    - name: Test build executable (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x gocommit
        file gocommit
        ./gocommit --help || echo "Binary created successfully"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: gocommit-${{ matrix.os }}
        path: gocommit
        retention-days: 30
